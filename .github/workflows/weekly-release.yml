name: 📦 双周规则快照发布

on:
  schedule:
    - cron: '0 2 * * 0'  # 每周日 UTC 02:00（北京时间 10:00）触发；奇偶周判断在下方 gate 步骤内完成
  workflow_dispatch:      # 手动触发时跳过奇偶周判断，立即发布

permissions:
  contents: write  # 授予创建 Tag 和 Release 的权限

concurrency:
  # 与 daily-update.yaml 共用同一组，避免二者同时改 main（都会 git push）
  group: repo-write
  cancel-in-progress: false  # 排队而非取消，避免打断发布

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: 🛠️ 检出仓库代码
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 1  # 仅拉取最新提交，加快检出速度

    - name: ⏱️ 判断是否为本期发布周（每两周一次）
      id: gate
      run: |
        # 手动触发：强制发布；定时触发：ISO 周数为奇数才发布（等效「每两周一次」）
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "ℹ️ 手动触发，跳过错开周判断，直接发布"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        WEEK=$(date -u +'%V')   # ISO 8601 周数（01-53）
        if [ $((10#$WEEK % 2)) -eq 1 ]; then
          echo "✅ 当前 ISO 周 $WEEK 为奇数周 → 本期发布"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        else
          echo "⏭️ 当前 ISO 周 $WEEK 为偶数周 → 跳过本次发布（下期发布）"
          echo "should_release=false" >> "$GITHUB_OUTPUT"
        fi

    - name: 📦 打包所有规则文件为 ZIP 压缩包
      if: steps.gate.outputs.should_release == 'true'
      run: |
        cd dist
        zip ../weekly-rules.zip *.txt
        cd ..

    - name: 📊 统计规则文件数量与拦截规则条目数
      if: steps.gate.outputs.should_release == 'true'
      id: stats
      run: |
        FILE_COUNT=$(ls -1 dist/*.txt 2>/dev/null | wc -l)
        ADBLOCK_COUNT=$(cat dist/adblock-mo.txt dist/adblock-pc.txt 2>/dev/null | grep -vcE '^\s*(!|\[|$)' || echo 0)
        DNS_COUNT=$(cat dist/dns-blocklist.txt 2>/dev/null | grep -vcE '^\s*(!|\[|$)' || echo 0)

        # 统计自定义组合规则文件的规则数（排除 3 个核心文件）
        CUSTOM_COUNT=0
        for f in dist/*.txt; do
          case "$f" in
            dist/adblock-mo.txt|dist/adblock-pc.txt|dist/dns-blocklist.txt) ;;
            *) CUSTOM_COUNT=$(( CUSTOM_COUNT + $(grep -vcE '^\s*(!|\[|$)' "$f" 2>/dev/null || echo 0) )) ;;
          esac
        done

        TOTAL_COUNT=$(( ADBLOCK_COUNT + DNS_COUNT ))

        # 格式化为千位分隔的数字，方便 Release 页面展示
        ADBLOCK_FMT=$(printf "%'d" $ADBLOCK_COUNT)
        DNS_FMT=$(printf "%'d" $DNS_COUNT)
        TOTAL_FMT=$(printf "%'d" $TOTAL_COUNT)

        echo "FILE_COUNT=$FILE_COUNT" >> $GITHUB_ENV
        echo "ADBLOCK_COUNT=$ADBLOCK_COUNT" >> $GITHUB_ENV
        echo "DNS_COUNT=$DNS_COUNT" >> $GITHUB_ENV
        echo "LINE_COUNT=$TOTAL_COUNT" >> $GITHUB_ENV
        echo "ADBLOCK_FMT=$ADBLOCK_FMT" >> $GITHUB_ENV
        echo "DNS_FMT=$DNS_FMT" >> $GITHUB_ENV
        echo "TOTAL_FMT=$TOTAL_FMT" >> $GITHUB_ENV

    - name: 🏷️ 自动生成版本号与 Git 标签
      if: steps.gate.outputs.should_release == 'true'
      id: version
      run: |
        DATE=$(date +'%Y.%m.%d')
        PERIOD_END=$(date -u +'%Y-%m-%d')
        PERIOD_START=$(date -u -d '13 days ago' +'%m/%d')
        echo "VERSION=$DATE" >> $GITHUB_ENV
        echo "PERIOD_START=$PERIOD_START" >> $GITHUB_ENV
        echo "PERIOD_END=$PERIOD_END" >> $GITHUB_ENV

        # 配置 Git 提交身份信息
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # 拉取最新代码（浅克隆友好：fetch + reset 替代 pull）
        git fetch --depth=1 origin main
        git reset --hard origin/main

        # 若远程同名标签已存在，则先删除再重建，保证版本覆盖正确。
        # 注意：浅克隆不会拉取 tags，必须查询远程（ls-remote）而非本地 rev-parse。
        if git ls-remote --tags origin "refs/tags/$DATE" | grep -q .; then
          echo "⚠️ 远程已存在 Tag $DATE，正在删除旧标签并重建..."
          git push origin ":refs/tags/$DATE" || true
        fi

        # 创建并推送新标签（--force 兜底，避免并发/残留导致的拒绝）
        git tag -f "$DATE"
        git push origin "$DATE" --force
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🚀 创建 GitHub Release 并上传附件
      if: steps.gate.outputs.should_release == 'true'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "${{ env.VERSION }}"
        name: "FilterFusion 规则快照 · ${{ env.VERSION }}"
        body: |
          🎉 **FilterFusion 规则快照 · ${{ env.VERSION }}** 🎉

          本期快照已生成。规则数据经全自动抓取、智能合并与精准去重处理，随附离线压缩包，供不便使用在线订阅的场景使用。

          > 📅 **覆盖周期：** ${{ env.PERIOD_START }} — ${{ env.PERIOD_END }}（近两周）
          > ⚙️ **处理流程：** 自动抓取上游源 → 智能合并去重 → 多格式分发
          > 🔄 **发布节奏：** 每两周一次（每日自动更新请使用下方订阅链接）

          ---

          ## 📋 本期更新概要

          本期整理了两大管道的规则数据，全面覆盖浏览器端与网络端的广告拦截场景：

          | 管道 | 规则数量 | 适用场景 |
          |------|:-------:|----------|
          | 🚫 **AdBlock 规则** | `${{ env.ADBLOCK_FMT }}` 条 | 浏览器扩展广告拦截（如 uBlock Origin、AdGuard 等） |
          | 🌍 **DNS 过滤规则** | `${{ env.DNS_FMT }}` 条 | 网络级广告拦截（路由器、AdGuard Home、Pi‑hole 等） |
          | ⚡ **双管道合计** | **${{ env.TOTAL_FMT }}** 条 | 全方位立体拦截 |

          ## 📊 详细统计

          | 指标 | 数值 |
          |------|:---:|
          | 📁 规则文件总数 | ${{ env.FILE_COUNT }} 个 |
          | 🚫 AdBlock 拦截规则 | ${{ env.ADBLOCK_FMT }} 条 |
          | 🌍 DNS 拦截规则 | ${{ env.DNS_FMT }} 条 |
          | 📝 **累计拦截规则** | **${{ env.TOTAL_FMT }}** 条 |

          ## 🎯 在线订阅（推荐）

          订阅链接每日自动更新，**无需关注 Release 版本**，添加一次即可长期自动获取最新规则。每条地址独立可用，**若某条导入失败请直接换下一条重试**。

          **🚫 AdBlock（浏览器端 — uBlock Origin / AdGuard 浏览器扩展）**
          ```
          https://fastly.jsdelivr.net/gh/Chaniug/FilterFusion@main/dist/adblock-mo.txt
          ```
          ```
          https://raw.githubusercontent.com/Chaniug/FilterFusion/main/dist/adblock-mo.txt
          ```
          ```
          https://gh.llkk.cc/https://raw.githubusercontent.com/Chaniug/FilterFusion/main/dist/adblock-mo.txt
          ```

          **🌍 DNS 过滤（网络级 — AdGuard Home / Pi‑hole 等）**
          ```
          https://fastly.jsdelivr.net/gh/Chaniug/FilterFusion@main/dist/dns-blocklist.txt
          ```
          ```
          https://raw.githubusercontent.com/Chaniug/FilterFusion/main/dist/dns-blocklist.txt
          ```
          ```
          https://gh.llkk.cc/https://raw.githubusercontent.com/Chaniug/FilterFusion/main/dist/dns-blocklist.txt
          ```

          ## 📦 附件说明

          | 文件 | 说明 |
          |------|------|
          | `weekly-rules.zip` | 包含本期所有 AdBlock 与 DNS 规则文件，解压即用，适合离线部署或批量导入 |

          ---

          💡 **小贴士：** 在线订阅可自动获取每日更新；本快照适用离线/内网/批量导入场景，每两周归档一次。

          🙏 **发现误杀或漏拦截？** 欢迎[提交 Issue](https://github.com/Chaniug/FilterFusion/issues) 反馈问题，我们会及时排查处理！

          ---

          🌟 **感谢您对 FilterFusion 的支持！** 如果这个项目对您有帮助，欢迎点个 ⭐，让更多朋友发现它！
        files: |
          weekly-rules.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🧹 清理旧 Release，仅保留最新数个
      if: steps.gate.outputs.should_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KEEP_RELEASES: 6   # ← 想保留的 Release 数量，改这一个数字即可（每两周发布 → 6 期≈3 个月）
      run: |
        REPO="${{ github.repository }}"
        echo "🧹 开始清理，仅保留最新 $KEEP_RELEASES 个 Release"

        gh release list --repo "$REPO" --limit 100 \
          --json tagName --jq '.[].tagName' \
          | tail -n +$((KEEP_RELEASES + 1)) \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "  🗑️ 删除 $tag"
              gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag \
                || gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" >/dev/null 2>&1 \
                || true
            done

        echo "✅ 清理完成，当前剩余 Release："
        gh release list --repo "$REPO" --limit 10 --json tagName --jq '.[].tagName'
