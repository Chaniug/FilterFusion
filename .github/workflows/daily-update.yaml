name: 🧬 每日自动更新

on:
  schedule:
    - cron: '0 0 * * *'      # UTC 0:00 = 北京时间 8:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

# Pages 部署并发控制（防止手动触发与定时任务并发部署冲突）
concurrency:
  # 与 weekly-release.yml 共用同一组，确保两者不会同时改 main
  group: repo-write
  cancel-in-progress: false  # 排队而非取消，避免打断生成流程

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: 🛠️ 检出仓库
      uses: actions/checkout@v7.0.0
      with:
        fetch-depth: 1
        token: ${{ secrets.PAT }}   # ✅ 使用 PAT 触发 Pages
        persist-credentials: false   # ✅ 禁止 post 步骤清理时报错

    - name: 📦 安装 uv + Python 3.14
      uses: astral-sh/setup-uv@v8.2.0
      with:
        python-version: '3.14'
        enable-cache: true
        cache-dependency-glob: |
          requirements.txt
          pyproject.toml

    - name: 📥 安装依赖
      run: |
        uv venv
        uv pip install -r requirements.txt

    - name: 🚀 抓取 + 合并所有规则（单进程）
      run: uv run --no-project python -m scripts.run_all

    - name: ✅ 校验规则文件（AdBlock + PC + DNS + 自定义）
      run: |
        # 校验核心文件（必须存在且非空）
        for f in dist/adblock-mo.txt dist/adblock-pc.txt dist/dns-blocklist.txt; do
          if [ ! -s "$f" ]; then
            echo "❌ 错误: $f 不存在或为空"
            exit 1
          fi
          echo "✅ $f: $(wc -l < "$f") 行"
        done

        # 列举自定义组合规则文件（可选，非空则显示行数）
        echo "📦 自定义规则文件:"
        for f in dist/*.txt; do
          case "$f" in
            dist/adblock-mo.txt|dist/adblock-pc.txt|dist/dns-blocklist.txt) ;;
            *) echo "  ✅ $f: $(wc -l < "$f") 行" ;;
          esac
        done

    - name: 🧹 清理临时规则文件与缓存
      run: |
        echo "🗑️ 清理 scripts 目录中的临时 .txt 规则文件"
        find scripts -maxdepth 1 -type f -name '*.txt' -delete || true

        echo "🗑️ 清理 Python 字节码缓存"
        find scripts -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true

        echo "✅ scripts 目录已清理"
        ls -1 scripts/

    - name: 📤 提交变更（使用 PAT 触发 Pages）
      id: commit-and-push
      env:
        TOKEN: ${{ secrets.PAT }}
      run: |
        git config user.name "FilterFusion Bot"
        git config user.email "filterfusion-bot@users.noreply.github.com"

        # 拉取远程最新（浅克隆友好，不需要完整历史）
        git fetch --depth=1 origin main

        # 同步到远程最新，保留工作区生成的规则文件
        git reset --soft origin/main

        git add dist config scripts

        if git diff --cached --quiet; then
          echo "ℹ️ 没有规则变更，跳过提交与部署"
          echo "deploy=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "FilterFusion自动更新: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"

          # 推送带重试：若远端在本次运行期间有新的提交（如 weekly 发布、
          # 人工合入），push 会被拒绝。此时以远端为基准重建提交后重推，最多 3 次。
          # 由于待提交内容就是工作区中已生成的 dist 文件，直接 reset --soft
          # 到远端最新并重新提交即可，无需 rebase（浅克隆下 rebase 不可靠）。
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "⚠️ 第 $attempt 次推送被拒，以远端为基准重建提交后重试…"
            git fetch --depth=1 origin main
            git reset --soft origin/main
            git add dist config scripts
            git commit -m "FilterFusion自动更新: $(date -u +'%Y-%m-%d %H:%M UTC')"
            sleep $((attempt * 3))
          done

          if [ "$pushed" != "true" ]; then
            echo "❌ 重试 3 次后仍无法推送，请检查远端状态"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
        fi

    # ============ 部署阶段（复用同一 Runner + 工作区，零切换成本） ============
    - name: ⚙️ 配置 Pages
      if: steps.commit-and-push.outputs.deploy == 'true'
      uses: actions/configure-pages@v6

    - name: 🚫 禁用 Jekyll
      if: steps.commit-and-push.outputs.deploy == 'true'
      run: touch dist/.nojekyll    # ✅ 禁止 Jekyll 处理，纯静态文件提速

    - name: 📦 上传产物
      if: steps.commit-and-push.outputs.deploy == 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: 'dist'

    - name: 🧹 清空 github-pages 历史部署记录（仅保留最新）
      if: steps.commit-and-push.outputs.deploy == 'true'
      uses: strumwolf/delete-deployment-environment@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        environment: github-pages
        onlyRemoveDeployments: true

    - name: 🚀 部署到 GitHub Pages
      id: deployment
      if: steps.commit-and-push.outputs.deploy == 'true'
      uses: actions/deploy-pages@v5
    - name: 🔥 主动刷新 Cloudflare 缓存
      if: steps.commit-and-push.outputs.deploy == 'true'
      env:
        CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: |
        # 清理 Secret 复制时可能带入的换行/回车/空格（避免 curl URL malformed）
        CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
        CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')"
        if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
          echo "INFO: CF_ZONE_ID/CF_API_TOKEN not set, skip Purge"
          exit 0
        fi
        curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data '{"purge_everything":true}'
        echo "OK: Cloudflare edge cache purged, new rules take effect immediately"
