[project]
name = "FilterFusion"
version = "1.0.0"
description = "高性能广告过滤规则合并工具，自动抓取、去重、分类多源规则"
authors = [
    {name = "Chaniug", email = "chaniug@example.com"}
]
license = "MIT"
requires-python = ">=3.14"
# 与 requirements.txt 保持一致（CI 只读 requirements.txt，此处供本地 pip install -e .[dev] 使用）
dependencies = [
    "httpx[http2]>=0.28.1,<0.29",
    "pyyaml>=6.0.3,<7"
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "basedpyright>=1.40.2",
    "black>=26.10.1",
    "isort>=9.0.2",
    "types-PyYAML>=6.0.12"
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = false
warn_unused_configs = true

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportExplicitAny = false
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnusedCallResult = "none"
reportUnusedImport = "warning"

# 测试套件仅本地维护，不随仓库分发；以下配置供本地开发使用
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]

[tool.black]
line-length = 120
target-version = ['py314']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
